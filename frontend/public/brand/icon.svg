<?xml version="1.0" encoding="UTF-8"?>
<!--
  Square app icon / monogram.

  A full wordmark cannot survive an app icon: at 60x60 physical pixels
  "ReviewBoost" is roughly 4pt type. This is the "B" — the letter carrying the
  weight and the colour in the wordmark — so the two stay related.

  Dark ink on the green, never white: white on #00A86B is 3.08:1.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="rb-icon-title">
  <title id="rb-icon-title">ReviewBoost</title>
  <rect width="512" height="512" rx="114" fill="#00A86B"/>
  <text x="256" y="352" text-anchor="middle"
        font-family="Geist, 'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="300" font-weight="700" letter-spacing="-12" fill="#0D2118">B</text>
</svg>
