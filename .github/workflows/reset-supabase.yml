name: Reset hosted Supabase (one-time)

on:
  workflow_dispatch:

concurrency:
  group: supabase-reset
  cancel-in-progress: false

jobs:
  reset-hosted-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      EXPECTED_REF: zoyqikgqfqulwkihjbev
      POOLER_HOST: aws-0-us-east-1.pooler.supabase.com

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Guard — no direct db endpoint in this workflow
        run: |
          set -euo pipefail
          if grep -Eq 'db\.[a-z${].*\.supabase\.co' .github/workflows/reset-supabase.yml; then
            echo "::error::Direct db.REF.supabase.co endpoint found — use the session pooler (POOLER_HOST) instead."
            exit 1
          fi
          echo "No direct db endpoint references found. OK."

      - name: Pre-flight — verify all data tables are empty
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          set -euo pipefail

          run_sql() {
            local out
            if ! out=$(psql -h "$POOLER_HOST" -p 5432 \
              -U "postgres.${EXPECTED_REF}" -d postgres \
              -t -A -c "$1" 2>&1); then
              echo "::error::psql failed: ${out}"
              exit 1
            fi
            printf '%s' "$out"
          }

          # --- auth.users (always expected to exist) ---
          auth_count=$(run_sql "SELECT count(*) FROM auth.users;")
          if ! [[ "$auth_count" =~ ^[0-9]+$ ]]; then
            echo "::error::Non-numeric result from auth.users count: '${auth_count}'"
            exit 1
          fi
          echo "auth.users: ${auth_count}"
          total=$auth_count

          # --- dynamically discover every public BASE TABLE ---
          table_list=$(run_sql "
            SELECT quote_ident(table_name)
            FROM information_schema.tables
            WHERE table_schema = 'public'
              AND table_type = 'BASE TABLE'
            ORDER BY table_name;
          ")
          if [ -z "$table_list" ]; then
            echo "::error::Table discovery returned no public tables — aborting (fail-closed)."
            exit 1
          fi

          table_count=0
          while IFS= read -r quoted_name; do
            [ -z "$quoted_name" ] && continue
            cnt=$(run_sql "SELECT count(*) FROM public.${quoted_name};")
            if ! [[ "$cnt" =~ ^[0-9]+$ ]]; then
              echo "::error::Non-numeric result from public.${quoted_name} count: '${cnt}'"
              exit 1
            fi
            echo "public.${quoted_name}: ${cnt}"
            total=$(( total + cnt ))
            table_count=$(( table_count + 1 ))
          done <<< "$table_list"

          echo "Discovered ${table_count} public tables."

          if [ "$total" -gt 0 ]; then
            echo "::error::Data exists in the hosted database (total=${total}). ABORTING to prevent data loss."
            exit 1
          fi
          echo "All counts verified zero (auth.users + ${table_count} public tables). Safe to proceed."

      - name: Link to Supabase project
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${SUPABASE_DB_PASSWORD}" | supabase link --project-ref "${EXPECTED_REF}"

      - name: Verify linked project ref
        run: |
          set -euo pipefail
          LINKED=$(cat supabase/.temp/project-ref)
          if [ "$LINKED" != "$EXPECTED_REF" ]; then
            echo "::error::Linked ref '${LINKED}' does not match expected '${EXPECTED_REF}'"
            exit 1
          fi
          echo "Linked project ref verified: ${LINKED}"

      - name: Reset hosted database from repo migrations (no seed)
        run: supabase db reset --linked --no-seed

      - name: Post-reset — migration list
        run: supabase migration list

      - name: Post-reset — verify no pending migrations
        run: |
          set -euo pipefail
          supabase db push --dry-run

      - name: Post-reset — verify schema health
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          set -euo pipefail

          run_sql() {
            psql -h "$POOLER_HOST" -p 5432 \
              -U "postgres.${EXPECTED_REF}" -d postgres \
              -t -A -c "$1"
          }

          tables=$(run_sql "
            SELECT count(*) FROM information_schema.tables
            WHERE table_schema = 'public' AND table_type = 'BASE TABLE';
          ")
          echo "Public tables: ${tables}"

          rpcs=$(run_sql "
            SELECT count(*) FROM information_schema.routines
            WHERE routine_schema = 'public' AND routine_type = 'FUNCTION';
          ")
          echo "Public RPCs: ${rpcs}"

          rls_count=$(run_sql "
            SELECT count(*) FROM pg_policies WHERE schemaname = 'public';
          ")
          echo "RLS policies: ${rls_count}"

          app_functions=$(run_sql "
            SELECT count(*) FROM information_schema.routines
            WHERE routine_schema = 'app' AND routine_type = 'FUNCTION';
          ")
          echo "app-schema functions: ${app_functions}"

          rls_enabled=$(run_sql "
            SELECT count(*) FROM pg_tables
            WHERE schemaname = 'public' AND rowsecurity = true;
          ")
          echo "Tables with RLS enabled: ${rls_enabled}"

          if [ "$tables" -lt 5 ]; then
            echo "::error::Expected at least 5 public tables, found ${tables}"
            exit 1
          fi
          if [ "$rpcs" -lt 1 ]; then
            echo "::error::Expected at least 1 public RPC, found ${rpcs}"
            exit 1
          fi
          if [ "$app_functions" -lt 1 ]; then
            echo "::error::Expected at least 1 app-schema function, found ${app_functions}"
            exit 1
          fi
          if [ "$rls_count" -lt 1 ]; then
            echo "::error::No RLS policies found"
            exit 1
          fi
          if [ "$rls_enabled" -lt 1 ]; then
            echo "::error::No tables with RLS enabled"
            exit 1
          fi
          echo "Schema health verified."
