name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reviewboost
          POSTGRES_PASSWORD: reviewboost
          POSTGRES_DB: reviewboost_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reviewboost"
          --health-interval 5s --health-timeout 5s --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgres://reviewboost:reviewboost@localhost:5432/reviewboost_test
      # Presence of this enables the RLS / quota / dedupe / lockout suite, which
      # is the only place tenant isolation is actually proven.
      TEST_DATABASE_URL: postgres://reviewboost:reviewboost@localhost:5432/reviewboost_test
      REDIS_URL: redis://localhost:6379
      PUBLIC_API_URL: http://localhost:4000
      PUBLIC_APP_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      SMS_DRY_RUN: 'true'
      JWT_SECRET: ci-only-secret-value-that-is-at-least-32-characters
      PII_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - name: Apply migrations
        run: npm run migrate
        working-directory: backend

      - name: Migrations are idempotent
        # A second run must be a no-op. If it is not, a migration is not
        # correctly recorded and a redeploy would try to apply it again.
        run: npm run migrate
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: backend
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a secret was committed
        run: |
          if git grep -nIE '^(JWT_SECRET|PII_ENCRYPTION_KEY|TWILIO_AUTH_TOKEN|TWILIO_API_KEY_SECRET|RESEND_API_KEY|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET)=.+' -- ':!*.example' ':!.github/**'; then
            echo "::error::A populated secret assignment is committed."
            exit 1
          fi
          if git grep -nIE '(re_[A-Za-z0-9_]{20,}|sk_live_[A-Za-z0-9]{20,}|SK[0-9a-f]{32}|AC[0-9a-f]{32})' -- ':!*.md'; then
            echo "::error::A live API key appears to be committed."
            exit 1
          fi
          echo "No committed secrets found."

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t reviewboost-api ./backend
