name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npx eslint .
        working-directory: frontend

  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npx vitest run
        working-directory: frontend

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a secret was committed
        run: |
          found=0

          if git grep -nIE '(SUPABASE_SERVICE_ROLE_KEY|PII_ENCRYPTION_KEY|TOKEN_DIGEST_KEY|ENCRYPTION_KEY)=.+' -- ':!*.example' ':!*.md' ':!docs/**' ':!.github/**'; then
            echo "::error::A populated secret assignment is committed."
            found=1
          fi

          if git grep -nIE '(eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{20,})' -- ':!*.example' ':!*.md' ':!.github/**'; then
            echo "::error::A JWT token appears to be committed."
            found=1
          fi

          if git grep -nIE '(sk_live_[A-Za-z0-9]{20,}|re_[A-Za-z0-9_]{20,})' -- ':!*.md' ':!.githooks/**'; then
            echo "::error::A live API key appears to be committed."
            found=1
          fi

          if [ "$found" -eq 1 ]; then
            exit 1
          fi
          echo "No committed secrets found."

  migration-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration file naming
        run: |
          for f in supabase/migrations/*.sql; do
            basename=$(basename "$f")
            if ! echo "$basename" | grep -qE '^[0-9]{14}_[a-z_]+\.sql$'; then
              echo "::error::Migration filename does not match convention: $basename"
              exit 1
            fi
          done
          echo "All migration filenames follow convention."

      - name: Check for review gating patterns
        run: |
          hits=$(grep -rniE '(review_threshold|feedback_intercept|reviews_prevented|review.?gat)' \
            supabase/migrations/ frontend/lib/server/ frontend/app/api/ \
            --include='*.sql' --include='*.ts' \
            | grep -v '^\s*--' \
            | grep -v 'hasnt_column' \
            | grep -v 'no review_threshold' \
            || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Prohibited review-gating pattern found."
            exit 1
          fi
          echo "No review-gating patterns found."

  staging-script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check the staging seed script
        run: node --check scripts/backend/seed-stand-remote.mjs

      - name: Run staging seed script tests
        run: node --test scripts/backend/__tests__/seed-stand-remote.test.mjs

  customer-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run customer flow E2E (mobile + desktop Chromium)
        run: npx playwright test tests/e2e/customer-flow.spec.ts tests/e2e/customer-flow-a11y.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
