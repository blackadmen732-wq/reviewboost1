services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reviewboost
      POSTGRES_PASSWORD: reviewboost
      POSTGRES_DB: reviewboost
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reviewboost -d reviewboost']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    # appendonly so a restart does not silently drop queued sends.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  # Runs migrations once, then exits. The API waits for it to finish, so a
  # deploy can never serve traffic against a half-migrated schema.
  migrate:
    build:
      context: ./backend
    environment: &app-env
      NODE_ENV: development
      PORT: '4000'
      LOG_LEVEL: info
      DATABASE_URL: postgres://reviewboost:reviewboost@postgres:5432/reviewboost
      REDIS_URL: redis://redis:6379
      PUBLIC_API_URL: http://localhost:4000
      PUBLIC_APP_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      SMS_DRY_RUN: 'true'
      # Development-only. Generate real values for anything deployed:
      #   openssl rand -base64 48   -> JWT_SECRET
      #   openssl rand -base64 32   -> PII_ENCRYPTION_KEY
      JWT_SECRET: local-development-only-secret-at-least-32-characters
      PII_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    depends_on:
      postgres: { condition: service_healthy }
    command: npm run migrate
    restart: 'no'

  api:
    build:
      context: ./backend
    environment: *app-env
    ports:
      - '4000:4000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    command: npm run worker
    # Scale sending throughput horizontally:
    #   docker compose up -d --scale worker=4
    deploy:
      replicas: 1

volumes:
  postgres-data:
  redis-data:
