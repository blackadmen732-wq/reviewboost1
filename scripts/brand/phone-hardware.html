<!doctype html>
<!--
  The owner preview's phone, as a 3D scene. Rendered by
  scripts/brand/render-phone-hardware.mjs — not served by the app.

  Everything is in device points: the screen hole is exactly the 390 x 844
  customer canvas. The phone faces +z; an orthographic camera looks straight
  at it, so the picture is a true front view that the live page can sit in.
-->
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "./three/build/three.module.js",
  "three/addons/": "./three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const P = {
  screenW: 390, screenH: 844, screenR: 55,
  bezel: 8.5,             // black glass border around the screen
  rim: 10.5,              // titanium visible from the front
  marginX: 7, marginY: 2, // room for the side buttons
  depth: 44,              // frame thickness
  bevelT: 13, bevelS: 8.8,
  color: "#7c7c82", roughness: 0.24,
  lipColor: "#b8b8bd", lipRoughness: 0.14,
  room: 0.14, glassEnv: 0.1, exposure: 1.0,
  // Studio light panels: [width, height, [x, y, z], intensity]. They sit
  // inside the environment camera's 100-unit far plane.
  lights: [
    [70, 50, [-40, 50, 40], 9],     // key softbox, upper left
    [18, 90, [60, 0, 30], 3.5],     // strip light, right
    [90, 18, [0, -60, 30], 1.8],    // low fill, bottom
    [170, 170, [0, 0, 85], 0.25],   // faint wall behind the camera
  ],
  scale: 3, // output pixels per point
  ss: 2,    // supersampling
  ...(window.PARAMS || {}),
};

const glassW = P.screenW + 2 * P.bezel, glassH = P.screenH + 2 * P.bezel, glassR = P.screenR + P.bezel;
const bodyW = glassW + 2 * P.rim, bodyH = glassH + 2 * P.rim, bodyR = glassR + P.rim;
const imgW = bodyW + 2 * P.marginX, imgH = bodyH + 2 * P.marginY;

function rr(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0, false);
  s.lineTo(x + w, y + h - r); s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2, false);
  s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, 1.5 * Math.PI, false);
  return s;
}

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(Math.round(imgW * P.scale * P.ss), Math.round(imgH * P.scale * P.ss));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = P.exposure;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// A product-photography studio: a dark room with a few large soft panels.
// The panels are what the curved titanium reflects as bright streaks; the
// dark room is what keeps the glass black.
const studio = new THREE.Scene();
studio.add(new THREE.Mesh(
  new THREE.BoxGeometry(180, 180, 180),
  new THREE.MeshBasicMaterial({ color: new THREE.Color(P.room, P.room, P.room), side: THREE.BackSide }),
));
for (const [w, h, pos, k] of P.lights) {
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
  panel.position.set(...pos);
  panel.lookAt(0, 0, 0);
  studio.add(panel);
}
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(studio, 0.02).texture;

const camera = new THREE.OrthographicCamera(-imgW / 2, imgW / 2, imgH / 2, -imgH / 2, 0.1, 1000);
camera.position.set(0, 0, 500);
camera.lookAt(0, 0, 0);

// Titanium band: a rounded-rect ring extruded with a round bevel, so its
// outer edge curves away from the viewer and catches the studio light.
const titanium = new THREE.MeshPhysicalMaterial({ color: P.color, metalness: 1, roughness: P.roughness });
{
  const band = rr(bodyW - 2 * P.bevelS, bodyH - 2 * P.bevelS, bodyR - P.bevelS);
  band.holes.push(rr(glassW - 6, glassH - 6, glassR - 3));
  const g = new THREE.ExtrudeGeometry(band, { depth: P.depth, bevelEnabled: true, bevelThickness: P.bevelT, bevelSize: P.bevelS, bevelSegments: 28, curveSegments: 96 });
  g.translate(0, 0, -(P.depth + P.bevelT)); // front face at z = 0
  scene.add(new THREE.Mesh(g, titanium));
}

// Polished lip: a narrow bright ring where the titanium meets the glass.
{
  const lipW = 1.6;
  const lip = rr(glassW + 2 * lipW, glassH + 2 * lipW, glassR + lipW);
  lip.holes.push(rr(glassW - 2, glassH - 2, glassR - 1));
  const g = new THREE.ExtrudeGeometry(lip, { depth: 0.2, bevelEnabled: true, bevelThickness: 0.6, bevelSize: 0.5, bevelSegments: 8, curveSegments: 96 });
  g.translate(0, 0, 0.05);
  scene.add(new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ color: P.lipColor, metalness: 1, roughness: P.lipRoughness })));
}

// Front glass: black, with a softly rounded edge, and a hole exactly the
// screen's size where the live page shows through.
{
  const e = 1.2;
  const glass = rr(glassW - 2 * e, glassH - 2 * e, glassR - e);
  glass.holes.push(rr(P.screenW + 2 * e, P.screenH + 2 * e, P.screenR + e));
  const g = new THREE.ExtrudeGeometry(glass, { depth: 0.4, bevelEnabled: true, bevelThickness: 1.0, bevelSize: e, bevelSegments: 10, curveSegments: 96 });
  g.translate(0, 0, 1.2);
  scene.add(new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({
    color: "#050506", metalness: 0, roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: P.glassEnv,
  })));
}

// Side buttons: rounded, standing just proud of the band at mid-thickness.
// Positions are fractions of the body's height from its top.
{
  // Rounded almost to a half-cylinder, so their tops curve like the band and
  // catch the same light instead of reflecting the dark room straight back.
  const proud = 2.8, thickness = 9, width = 10;
  const button = (topFrac, lenFrac, side) => {
    const len = bodyH * lenFrac;
    const m = new THREE.Mesh(new RoundedBoxGeometry(width, len, thickness, 10, 4.3), titanium);
    m.position.set(side * (bodyW / 2 + proud - width / 2), bodyH / 2 - bodyH * topFrac - len / 2, -(P.depth + P.bevelT) / 2 - 2);
    scene.add(m);
  };
  button(0.155, 0.044, -1); // action
  button(0.225, 0.08, -1);  // volume up
  button(0.32, 0.08, -1);   // volume down
  button(0.25, 0.12, 1);    // side button
}

renderer.render(scene, camera);

// Supersampled: downscale to the output size.
const out = document.createElement("canvas");
out.width = Math.round(imgW * P.scale);
out.height = Math.round(imgH * P.scale);
const ctx = out.getContext("2d");
ctx.imageSmoothingQuality = "high";
ctx.drawImage(renderer.domElement, 0, 0, out.width, out.height);

window.RESULT = {
  webp: out.toDataURL("image/webp", 0.92),
  png: out.toDataURL("image/png"),
  geometry: {
    imgW, imgH, bodyW, bodyH, bodyR, glassW, glassH, glassR,
    screen: { left: P.marginX + P.rim + P.bezel, top: P.marginY + P.rim + P.bezel, width: P.screenW, height: P.screenH, radius: P.screenR },
    body: { left: P.marginX, top: P.marginY },
    glass: { left: P.marginX + P.rim, top: P.marginY + P.rim },
    pixels: [out.width, out.height],
  },
};
</script>
</body>
</html>
